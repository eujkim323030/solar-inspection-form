<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8ebe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="수검자서식">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>태양광 수검자 서식</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" defer></script>
<style>
  /* 안전조회 앱과 같은 모양: 세이지 배경, 흰 카드, 라임 주 버튼 */
  :root {
    --ink:#0e0f0c; --body:#454745; --mute:#868685;
    --canvas:#ffffff; --sage:#e8ebe6; --tint:#f1f3ef; --line:#d6dad3; --line-soft:#eceee9;
    --primary:#9fe870; --primary-active:#cdffad; --primary-pale:#e2f6d5; --pos-deep:#054d28;
    --warn:#ffd11a; --warn-text:#4a3b1c; --neg:#d03238; --focus:#2f6fed;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--sage); color:var(--ink); font:16px/1.5 "Pretendard Variable",Pretendard,-apple-system,"Malgun Gothic",sans-serif; word-break:keep-all; overflow-wrap:anywhere; }
  button, input, select, textarea { font:inherit; color:inherit; }
  h1, h2, p { margin:0; }
  main { padding:calc(20px + env(safe-area-inset-top)) 16px 40px; max-width:720px; margin:0 auto; }
  .page-title { font-size:30px; font-weight:900; letter-spacing:-.6px; line-height:1.15; margin:8px 0 4px; }
  .page-sub { color:var(--body); font-size:14px; margin-bottom:20px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:48px; padding:12px 24px; border-radius:24px; border:0; background:var(--primary); color:var(--ink); font-size:16px; font-weight:600; line-height:1.4; cursor:pointer; white-space:nowrap; }
  .btn:active { background:var(--primary-active); }
  .btn.ter { background:var(--canvas); box-shadow:inset 0 0 0 1px var(--ink); }
  .btn.danger { background:var(--canvas); color:var(--neg); box-shadow:inset 0 0 0 1px var(--neg); }
  .btn.full { width:100%; }
  .btn.lg { min-height:60px; font-size:18px; font-weight:700; }
  .btn.link { background:none; box-shadow:none; color:var(--body); min-height:44px; padding:8px 0; font-size:15px; }
  .btn svg { width:20px; height:20px; }
  .row { display:flex; gap:8px; align-items:center; }
  .grow { flex:1; min-width:0; }
  .stack > * + * { margin-top:10px; }
  .note { font-size:14px; color:var(--body); line-height:1.6; }
  label.f { display:block; font-size:15px; font-weight:600; margin:16px 0 6px; }
  input[type=text] { width:100%; min-height:56px; padding:12px 16px; font-size:20px; border:1px solid var(--ink); border-radius:14px; background:var(--canvas); outline:none; -webkit-appearance:none; appearance:none; }
  input[type=text]:focus { border:2px solid var(--ink); padding:11px 15px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
  .chk { display:flex; align-items:center; gap:10px; margin-top:16px; font-size:15px; color:var(--body); }
  .chk input { width:22px; height:22px; }
  .banner { background:var(--warn); color:var(--warn-text); border-radius:18px; padding:14px 16px; margin-bottom:16px; font-size:15px; font-weight:600; }
  .banner .btn { margin-top:10px; }

  /* 현장 목록 */
  .site { display:block; width:100%; text-align:left; border:0; background:var(--canvas); border-radius:20px; padding:18px 20px; margin-top:12px; cursor:pointer; }
  .site .t { font-size:20px; font-weight:800; }
  .site .s { font-size:14px; color:var(--body); margin-top:2px; }
  .empty { color:var(--mute); font-size:15px; padding:16px 4px; }

  /* 바텀시트 */
  .sheet-bg { position:fixed; inset:0; background:rgba(14,15,12,.4); z-index:20; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:var(--canvas); width:100%; max-width:640px; max-height:90vh; overflow:auto; border-radius:24px 24px 0 0; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); }
  .sheet h2 { font-size:22px; font-weight:800; margin-bottom:6px; }
  .pick { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px; }
  .pick button { text-align:left; min-height:52px; padding:10px 14px; border-radius:14px; border:0; background:var(--tint); font-size:14px; font-weight:600; line-height:1.3; cursor:pointer; }
  .pick button small { display:block; font-weight:500; color:var(--body); font-size:12px; }
  .pad { display:block; width:100%; height:220px; border:2px dashed var(--mute); border-radius:16px; background:#fff; touch-action:none; margin-top:12px; }

  /* 현장 문서: 서식 장들이 위아래로 이어진다 */
  body.ed { background:#cfd3cc; }
  .tb { position:fixed; top:0; left:0; right:0; z-index:10; background:var(--canvas); box-shadow:0 1px 0 var(--line); padding:calc(8px + env(safe-area-inset-top)) 10px 8px; }
  .tb .ttl { font-weight:800; font-size:17px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tb .ttl small { display:block; font-weight:500; font-size:13px; color:var(--body); }
  .tool { flex:none; min-width:48px; height:48px; padding:0 14px; border-radius:14px; border:0; background:var(--tint); color:var(--ink); font-size:16px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; white-space:nowrap; }
  .tool svg { width:22px; height:22px; }
  .tool.pri { background:var(--primary); }
  .tool[hidden] { display:none; }
  .tool.done { background:var(--primary-pale); color:var(--pos-deep); }
  /* 쓰는 판: 칸을 누르면 화면 아래에서 올라온다 (은행 패드 서류처럼) */
  .panel { position:fixed; left:0; right:0; bottom:0; z-index:12; display:none; background:var(--canvas); border-radius:22px 22px 0 0; box-shadow:0 -6px 24px rgba(14,15,12,.18); padding:12px 12px calc(12px + env(safe-area-inset-bottom)); }
  body.editing .panel { display:block; }
  .panel .inner { max-width:1100px; margin:0 auto; }
  .panel .lab { font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .panel .phead { margin-bottom:8px; }
  .panel .pfoot { margin-top:8px; }
  .panel input, .panel textarea { width:100%; min-height:52px; padding:10px 14px; font-size:20px; border:2px solid var(--focus); border-radius:14px; outline:none; background:var(--canvas); }
  .panel textarea { resize:none; height:90px; font-size:17px; line-height:1.35; }
  .seg2 { flex:none; display:flex; gap:3px; padding:3px; background:var(--tint); border-radius:14px; }
  .seg2 button { border:0; background:none; min-height:42px; padding:0 14px; border-radius:11px; font-size:16px; font-weight:700; color:var(--body); cursor:pointer; white-space:nowrap; }
  .seg2 button.on { background:var(--ink); color:#fff; }
  .hpad { display:block; width:100%; height:clamp(140px, 24vh, 230px); border:2px solid var(--focus); border-radius:14px; background:#fff; touch-action:none; }
  .hpad.area { height:clamp(180px, 32vh, 300px); }
  .doc { padding:calc(var(--tbh, 66px) + 8px) 6px 40px; }
  body.editing .doc { padding-bottom:calc(var(--pnh, 300px) + 24px); }
  .pscroll { max-width:1100px; margin:0 auto; }
  /* 폰: 서식을 패드와 같은 크기로 보여 주고 좌우로 밀어서 본다 */
  @media (max-width: 700px) {
    .pscroll { overflow-x:auto; -webkit-overflow-scrolling:touch; margin:0 -6px; }
    .pscroll .page { width:760px; max-width:none; margin:0; }
    .long { display:none; }
    .tb .ttl { font-size:15px; }
    .tool { padding:0 10px; }
    .seg2 button { padding:0 10px; font-size:15px; }
  }
  .tip { max-width:1100px; margin:4px auto 0; font-size:14px; color:var(--body); text-align:center; }
  .shh { display:flex; align-items:center; gap:8px; max-width:1100px; margin:22px auto 8px; padding:0 2px; }
  .shh .no { flex:none; width:30px; height:30px; border-radius:9999px; background:var(--ink); color:#fff; font-size:14px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .shh b { font-size:17px; }
  .okbtn { flex:none; min-height:44px; padding:0 16px; border-radius:22px; border:0; background:var(--primary); font-size:15px; font-weight:700; cursor:pointer; }
  .icon-btn { flex:none; width:44px; height:44px; border-radius:9999px; border:0; background:var(--canvas); color:var(--body); display:inline-flex; align-items:center; justify-content:center; padding:0; cursor:pointer; }
  .icon-btn svg { width:20px; height:20px; }
  .page { position:relative; margin:0 auto; max-width:1100px; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.15); -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  .page img, .page canvas { position:absolute; inset:0; width:100%; height:100%; display:block; pointer-events:none; }
  .hits { position:absolute; inset:0; }
  .hit { position:absolute; cursor:pointer; }
  .act { position:absolute; border:2px solid var(--focus); border-radius:2px; background:rgba(47,111,237,.12); pointer-events:none; display:none; }
  .docend { max-width:640px; margin:28px auto 0; padding:0 10px; }
  .busy { position:fixed; inset:0; z-index:30; background:rgba(14,15,12,.45); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; font-size:18px; }
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
'use strict';
// ---------- 카톡 같은 앱 안 화면이면 크롬·사파리로 (앱 안에서는 PDF 저장·공유가 막히는 경우가 많다) ----------
const UA = navigator.userAgent;
const KAKAO = /KAKAOTALK/i.test(UA), ANDROID = /Android/i.test(UA);
const IN_APP = KAKAO || /NAVER\(inapp|Line\/|Instagram|FBAN|FBAV|BAND\/|DaumApps|; wv\)/i.test(UA);
function openOutside() {
  const url = location.href.split('#')[0];
  if (KAKAO) location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
  else if (ANDROID) location.href = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`;
}
if (KAKAO) {
  let tried = false;
  try { tried = sessionStorage.getItem('outside') === '1'; sessionStorage.setItem('outside', '1'); } catch (e) { /* 그냥 시도 */ }
  if (!tried) openOutside();
}
const outsideHelp = () => `<div class="banner">지금은 ${KAKAO ? '카톡' : '다른 앱'} 안에서 열린 화면이라 PDF 보내기가 안 될 수 있어요.
  ${KAKAO || ANDROID ? '<br><button class="btn" data-out>크롬·사파리로 열기</button>' : '<br>화면의 공유(또는 ⋯) 버튼 → "Safari로 열기"를 눌러 주세요.'}</div>`;
document.addEventListener('click', e => { if (e.target.closest('[data-out]')) openOutside(); });

// ---------- 오프라인 지원 ----------
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');

// ---------- 저장소 (IndexedDB) ----------
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('suggeom', 1);
  r.onupgradeneeded = () => ['sites', 'meta'].forEach(s => r.result.createObjectStore(s, { keyPath: 'id' }));
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
function tx(store, mode, fn) {
  return dbp.then(d => new Promise((res, rej) => {
    const t = d.transaction(store, mode), req = fn(t.objectStore(store));
    t.oncomplete = () => res(req.result);
    t.onerror = () => rej(t.error);
  }));
}
const getAll = s => tx(s, 'readonly', st => st.getAll());
const get = (s, id) => tx(s, 'readonly', st => st.get(id));
const put = (s, v) => tx(s, 'readwrite', st => st.put(v));
const del = (s, id) => tx(s, 'readwrite', st => st.delete(id));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const stamp = iso => { const d = new Date(iso); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };
const $ = s => document.querySelector(s);
const app = $('#app'), modal = $('#modal');
const I = {
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  sign: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-5 5-9 7-9 3 0-2 9 1 9 2 0 3-3 4-3s1 3 3 3"/><path d="M3 21h18"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10 14"/><path d="M21 3l-7 18-4-7-7-4z"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
};

// 패드·폰에서 공유창(카톡 등)으로 바로 보낼 수 있으면 "카톡으로 보내기", 아니면(컴퓨터) "PDF 저장"
const CAN_SHARE = (() => {
  try { return navigator.maxTouchPoints > 0 && !!navigator.canShare && navigator.canShare({ files: [new File(['x'], 'a.pdf', { type: 'application/pdf' })] }); }
  catch (e) { return false; }
})();
const SEND_LABEL = CAN_SHARE ? '카톡으로 보내기' : 'PDF 저장';
const SEND_HTML = CAN_SHARE ? '<span class="long">카톡으로 </span>보내기' : 'PDF 저장';   // 폰처럼 좁으면 "보내기"만
// 칸 입력 방식: 'pen'(손글씨) 또는 'kb'(글자). 아빠는 대부분 손으로 쓰셔서 칸을 누르면 언제나 손글씨로 시작한다.
let inputMode = 'pen', penSeen = false, inkAt = 0;

// ---------- 서식 정보 (tools/build.py 가 공식 서식 PDF에서 뽑은 칸 좌표) ----------
let META = [];
const TPL = {};
async function loadMeta() {
  META = await (await fetch('fields.json')).json();
  META.forEach((m, i) => {
    m.order = i;
    m.byId = {};
    m.fields.forEach(f => { m.byId[f.id] = f; });
    m.inputs = m.fields.filter(f => f.t !== 'check');
    m.goods = goodFirsts(m);
  });
  META.forEach(m => { TPL[m.tpl] = m; });
}
// 검사 종류별 기본 서식 (공식 서식 2·3쪽 목록 기준)
const BASIC = { '사용전': ['p04', 'p05', 'p07', 'p08', 'p09', 'p10'], '정기': ['p04', 'p05', 'p07', 'p09', 'p11'] };
const HIGH = ['p14', 'p15', 'p16', 'p17', 'p18', 'p19', 'p20'];
// 새 현장에 지난 현장 값을 그대로 가져오는 범위 (서식 y좌표 pt, 끝값 미포함, 'text'면 글자 칸만).
// 회사·측정 장비·모듈·인버터·구조물·저압반 사양만 가져오고 측정값·날짜·일련번호(S/N)·서명줄은 비운다.
const CARRY = {
  p04: [[265, 600]],                                  // 측정/시험 업체, 측정 장비, 작성자 연락처
  p05: [[130, 276], [296, 312]],                      // 모듈 규격 (대표모듈 S/N 제외)
  p07: [[130, 300], [320, 340], [455, 700]],          // 인버터 규격 (S/N 제외), 성적서 값, 보호장치 설정
  p08: [[130, 285]],                                  // 구조물 규격
  p09: [[150, 300], [450, 570], [580, 670, 'text']],  // 저압반 규격, 보호계전기 (시험 결과 체크는 제외)
};
const NUMERIC = /[[(]\s*(V|A|W|Ω|㏁|MΩ|kW|㎾|kA|%|℃|Hz|㎐|S|s|sec|Sec|kV|㎃|mA|㎂|kVA)\s*[\])]/;
// 서명을 찍는 자리. 시공 체크리스트는 점검자 칸만 (시공관리책임자·감리원은 다른 사람)
const sigSpots = m => m.tpl === 'p10' ? m.sig.slice(0, 1) : m.sig;
// "모두 양호"가 채울 칸: 양호/불량, 없음/있음 묶음의 첫째 칸 (날씨·유무 같은 묶음은 건드리지 않는다)
function goodFirsts(m) {
  const groups = {};
  for (const f of m.fields) if (f.ex) (groups[f.grp] = groups[f.grp] || []).push(f);
  return Object.values(groups).map(g => g.slice().sort((a, b) => a.r[0] - b.r[0]))
    .filter(g => g[0].label === '양호' || g[0].label === '없음');
}

// ---------- 글자·체크·서명 그리기 (화면과 PDF가 같은 함수를 쓴다) ----------
const FONT = '-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif';
const INK = '#111111';
function wrapLines(ctx, text, w) {
  const out = [];
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const ch of para) {
      if (line && ctx.measureText(line + ch).width > w) { out.push(line); line = ch; } else line += ch;
    }
    out.push(line);
  }
  return out;
}
// 칸 크기에 맞춰 글자 크기를 줄인다. 반환값은 px(= pt × scale)
function fit(ctx, f, text, scale) {
  const [x0, y0, x1, y1] = f.r, w = (x1 - x0 - 2) * scale, h = (y1 - y0 - 1) * scale;
  const multi = f.t === 'area';
  let size = Math.min(multi ? 9 : (y1 - y0) * 0.72, 10.5) * scale;
  for (; size >= 3.5 * scale; size -= 0.25 * scale) {
    ctx.font = `${size}px ${FONT}`;
    if (!multi) { if (ctx.measureText(text).width <= w) return { size, lines: [text] }; continue; }
    const lines = wrapLines(ctx, text, w);
    if (lines.length * size * 1.25 <= h) return { size, lines };
  }
  ctx.font = `${size}px ${FONT}`;
  return { size, lines: multi ? wrapLines(ctx, text, w) : [text] };
}
// 손글씨 값: { ink: [[x,y,x,y…] 획들], box: [왼,위,오른,아래] } — 좌표 단위는 패드 높이 = 100
const isInk = v => !!v && typeof v === 'object' && Array.isArray(v.ink);
function inkBox(ink) {
  let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity;
  for (const s of ink) for (let i = 0; i < s.length; i += 2) {
    a = Math.min(a, s[i]); c = Math.max(c, s[i]); b = Math.min(b, s[i + 1]); d = Math.max(d, s[i + 1]);
  }
  return [a, b, c, d];
}
// 손글씨를 칸 안에 맞춘다: 글씨 덩어리를 비율 그대로 칸 크기까지 줄이고, 글자와 같은 쪽으로 정렬.
// 패드 높이 절반쯤 되는 글씨가 칸 높이를 채우도록 상한을 둬서 "-" 하나가 칸 끝까지 늘어나지 않게 한다.
function drawInk(ctx, v, f, scale) {
  const [x0, y0, x1, y1] = f.r, area = f.t === 'area';
  const px = 1, py = area ? 1.5 : Math.min(1.5, (y1 - y0) * 0.12);
  const W = x1 - x0 - px * 2, H = y1 - y0 - py * 2, b = v.box;
  const bw = Math.max(b[2] - b[0], 0.5), bh = Math.max(b[3] - b[1], 0.5);
  const k = Math.min(W / bw, H / bh, area ? 0.35 : H / 50);
  const dw = bw * k, dh = bh * k, wide = x1 - x0 > 70;
  const ox = f.unit ? x1 - px - dw : wide || area ? x0 + px : (x0 + x1 - dw) / 2;
  const oy = area ? y0 + py : (y0 + y1 - dh) / 2;
  ctx.save();
  ctx.strokeStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(0.45, Math.min(0.9, 2.2 * k)) * scale;
  for (const s of v.ink) {
    ctx.beginPath();
    for (let i = 0; i < s.length; i += 2) {
      const X = (ox + (s[i] - b[0]) * k) * scale, Y = (oy + (s[i + 1] - b[1]) * k) * scale;
      if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
    }
    if (s.length === 2) ctx.lineTo((ox + (s[0] - b[0]) * k) * scale + 0.01, (oy + (s[1] - b[1]) * k) * scale);
    ctx.stroke();
  }
  ctx.restore();
}
// 공사 예시값은 서식 위에 그리지 않는다 (이미 채운 줄로 착각하지 않게). 칸을 누르면 입력 막대에 "예:"로 보인다.
function drawSheet(ctx, sh, scale, sign) {
  const m = TPL[sh.tpl];
  ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
  ctx.textBaseline = 'middle';
  for (const f of m.fields) {
    const v = sh.v[f.id];
    if (f.t === 'check') {
      if (v) { ctx.fillStyle = INK; const [a, b, c, d] = f.sq; ctx.fillRect(a * scale, b * scale, (c - a) * scale, (d - b) * scale); }
      continue;
    }
    if (isInk(v)) { drawInk(ctx, v, f, scale); continue; }
    const text = v;
    if (!text) continue;
    const { size, lines } = fit(ctx, f, text, scale);
    ctx.fillStyle = INK;
    const [x0, y0, x1, y1] = f.r;
    if (f.t === 'area') {
      ctx.textAlign = 'left';
      lines.forEach((ln, i) => ctx.fillText(ln, (x0 + 1) * scale, (y0 + 1) * scale + size * (0.65 + i * 1.25)));
    } else {
      const wide = x1 - x0 > 70;
      ctx.textAlign = f.unit ? 'right' : wide ? 'left' : 'center';
      const x = f.unit ? (x1 - 1) * scale : wide ? (x0 + 1.5) * scale : (x0 + x1) / 2 * scale;
      ctx.fillText(lines[0], x, (y0 + y1) / 2 * scale + size * 0.05);
    }
  }
  if (sign) for (const spot of sigSpots(m)) stampSign(ctx, sign, spot, scale);
}
// 서명 획을 '(서명)' 글자 위에 겹쳐 찍는다 (높이 26pt·너비 80pt 안, 오른쪽은 표 밖으로 나가지 않게)
function stampSign(ctx, sign, spot, scale) {
  const [x0, y0, x1, y1] = spot, b = sign.box;
  const bw = Math.max(b[2] - b[0], 1), bh = Math.max(b[3] - b[1], 1);
  const k = Math.min(Math.min((y1 - y0) * 2.2, 26) / bh, 80 / bw);
  const cx = Math.min((x0 + x1) / 2, x1 + 6 - bw * k / 2), cy = (y0 + y1) / 2, bx = (b[0] + b[2]) / 2, by = (b[1] + b[3]) / 2;
  ctx.save();
  ctx.strokeStyle = INK; ctx.lineWidth = 1.1 * scale; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const s of sign.s) {
    ctx.beginPath();
    for (let i = 0; i < s.length; i += 2) {
      const X = (cx + (s[i] - bx) * k) * scale, Y = (cy + (s[i + 1] - by) * k) * scale;
      if (i) ctx.lineTo(X, Y); else ctx.moveTo(X, Y);
    }
    if (s.length === 2) ctx.lineTo((cx + (s[0] - bx) * k) * scale + 0.01, (cy + (s[1] - by) * k) * scale);
    ctx.stroke();
  }
  ctx.restore();
}

const sheetName = (site, sh) => {
  const same = site.sheets.filter(x => x.tpl === sh.tpl);
  return TPL[sh.tpl].short + (same.length > 1 ? ` #${same.indexOf(sh) + 1}` : '');
};
const sortSheets = site => site.sheets.sort((a, b) => TPL[a.tpl].order - TPL[b.tpl].order);

async function getTags() { return ((await get('meta', 'tags')) || { id: 'tags', v: {} }).v; }
// 새 장: 기본값, 사업장명(현장 이름), 날짜(오늘), 지난번에 적은 작성자·서명줄 이름
async function newSheet(site, tpl, from) {
  const m = TPL[tpl], tags = await getTags(), [y, mo, d] = today().split('-');
  const sh = { id: uid(), tpl, v: from ? { ...from.v } : {} };
  if (!from) for (const f of m.fields) {
    let v = f.default || '';
    if (f.tag === 'site.name') v = site.name;
    else if (f.tag === 'date.년') v = y;
    else if (f.tag === 'date.월') v = String(+mo);
    else if (f.tag === 'date.일') v = String(+d);
    else if (f.tag && tags[f.tag]) v = tags[f.tag];
    if (v) sh.v[f.id] = v;
  }
  return sh;
}
// 지난 현장의 같은 서식에서 사양 칸만 가져온다
function carry(from, to) {
  for (const f of TPL[to.tpl].fields) {
    const y = f.r[1], v = from.v[f.id];
    if (v != null && (CARRY[to.tpl] || []).some(([a, b, t]) => y >= a && y < b && (!t || f.t === t))) to.v[f.id] = v;
  }
}

// ---------- 드라이브 연동 (관리자 구글 드라이브가 공용 창고, drive-sync.gs 참고) ----------
// 기기마다 ① 지운 현장을 알리고 ② 만들거나 고친 현장을 올리고 ③ 다른 기기에서 고친 현장을 받아 온다.
// 같은 현장을 두 기기에서 고치면 나중에 올린 쪽이 남는다. 인터넷이 없으면 기기에 먼저 저장했다가 연결되면 맞춘다.
// 팀 코드를 모르면 읽기·쓰기 모두 막힌다. 주소가 비어 있으면 연동 없이 이 기기에만 저장한다.
const SYNC_URL = '';
async function api(action, extra = {}, code) {
  code = code || ((await get('meta', 'team')) || {}).code;
  const res = await fetch(SYNC_URL, { method: 'POST', body: JSON.stringify({ app: 'suggeom', version: 1, code, action, ...extra }) });
  const j = await res.json();
  if (!j.ok) throw new Error(j.error || 'failed');
  return j;
}
let syncing = false, syncAgain = false, syncFailed = false, syncTimer = 0;
// 고치는 중에는 잠시(8초) 손을 멈췄을 때 올린다
function scheduleSync() {
  if (!SYNC_URL) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncDrive, 8000);
}
async function syncDrive() {
  if (!SYNC_URL || !navigator.onLine || !(await get('meta', 'team'))) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; clearTimeout(syncTimer); showSync();
  let changed = false;
  try {
    if (curSite) { clearTimeout(saveTimer); await put('sites', curSite); }
    const synced = ((await get('meta', 'synced')) || { map: {} }).map;
    const saveSynced = () => put('meta', { id: 'synced', map: synced });
    // ① 이 기기에서 지운 현장
    const dq = ((await get('meta', 'deletedQ')) || { ids: [] }).ids;
    while (dq.length) {
      await api('delete', { id: dq[0] });
      delete synced[dq.shift()];
      await put('meta', { id: 'deletedQ', ids: dq }); await saveSynced();
    }
    // ② 이 기기에서 만들거나 고친 현장 올리기
    for (const s of await getAll('sites')) {
      if (synced[s.id] === s.updatedAt) continue;
      await api('put', { site: s });
      synced[s.id] = s.updatedAt; await saveSynced();
    }
    // ③ 다른 기기에서 고친 현장 받기 (지워진 현장은 이 기기에서도 지움). 지금 열어 둔 현장은 닫은 뒤에 맞춘다.
    const { index } = await api('list');
    for (const s of await getAll('sites')) if (!index[s.id]) {   // 드라이브에서 사라진 현장은 다시 올린다
      await api('put', { site: s });
      synced[s.id] = s.updatedAt; index[s.id] = { ver: s.updatedAt };
    }
    const open = curSite && curSite.id, need = [];
    for (const [id, m] of Object.entries(index)) {
      if (id === open) continue;
      if (m.deleted) { if (await get('sites', id)) { await del('sites', id); changed = true; } delete synced[id]; }
      else if (synced[id] !== m.ver) need.push(id);
    }
    for (let i = 0; i < need.length; i += 3) {
      const { sites } = await api('get', { ids: need.slice(i, i + 3) });
      for (const s of sites) { await put('sites', s); synced[s.id] = s.updatedAt; changed = true; }
      await saveSynced();
    }
    await saveSynced();
    await put('meta', { id: 'syncAt', at: new Date().toISOString() });
    syncFailed = false;
  } catch (e) {
    syncFailed = true;   // 인터넷이 끊기면 다음에 앱을 열거나 연결될 때 다시 맞춘다
    if (e.message === 'bad code') { await del('meta', 'team'); syncing = false; route(); return; }
  }
  syncing = false;
  if (changed && !curSite && !modal.innerHTML) viewHome(); else showSync();
  if (syncAgain) { syncAgain = false; syncDrive(); }
}
addEventListener('online', syncDrive);
addEventListener('visibilitychange', () => { if (!document.hidden) syncDrive(); });
// 첫 화면의 드라이브 상태 한 줄
async function showSync() {
  const el = $('#syncst');
  if (!el || !SYNC_URL) return;
  const synced = ((await get('meta', 'synced')) || { map: {} }).map, dq = ((await get('meta', 'deletedQ')) || { ids: [] }).ids;
  const pending = (await getAll('sites')).filter(s => synced[s.id] !== s.updatedAt).length + dq.length;
  const at = (await get('meta', 'syncAt') || {}).at;
  el.textContent = syncing ? '드라이브와 맞추는 중…'
    : syncFailed || (pending && !navigator.onLine) ? `드라이브에 아직 못 올린 현장 ${pending}곳 · 인터넷이 되면 올려요`
    : pending ? `드라이브에 올릴 현장 ${pending}곳`
    : at ? `드라이브에 저장됨 · ${stamp(at)} ${new Date(at).toTimeString().slice(0, 5)}` : '';
}

let viewToken = 0, viewCleanup = () => {};
addEventListener('hashchange', route);
async function route() {
  const [, , sid, shid] = location.hash.split('/');
  viewToken++; viewCleanup();
  modal.innerHTML = '';
  const leaving = !!curSite;
  if (curSite) { clearTimeout(saveTimer); await put('sites', curSite); }
  document.body.classList.remove('ed');
  if (SYNC_URL && !(await get('meta', 'team'))) { curSite = null; return viewTeam(); }
  if (!sid) { await viewHome(); if (leaving) syncDrive(); return; }   // 현장에서 나오면 바로 드라이브에 올린다
  const site = await get('sites', sid);
  if (!site) { location.hash = '#/'; return; }
  curSite = site;
  viewDoc(site, shid);
}

function newSiteSheet(sites) {
  const prev = sites[0];
  sheetModal(`<h2>새 현장</h2>
    <label class="f" for="nm">현장 이름</label>
    <input type="text" id="nm" placeholder="예: ○○태양광발전소" autocomplete="off">

    <label class="chk"><input type="checkbox" id="hv"> 고압 이상 연계 (특고압 서식 7장도 넣기)</label>
    ${prev ? `<p class="note" style="margin-top:12px">지난 현장(${esc(prev.name)})의 회사·장비·모듈·인버터 정보를 그대로 넣어 드려요. 측정값은 비워 둬요.</p>` : ''}`);
  let making = false;   // 두 번 눌러 현장이 둘 생기지 않게
  modal.querySelectorAll('[data-k]').forEach(b => b.onclick = async () => {
    const name = $('#nm').value.trim();
    if (!name) { $('#nm').focus(); $('#nm').placeholder = '현장 이름을 먼저 써 주세요'; return; }
    if (making) return;
    making = true;
    const kind = b.dataset.k;
    const site = { id: uid(), name, kind, volt: $('#hv').checked ? '고압' : '저압', createdAt: new Date().toISOString(), sheets: [] };
    for (const t of [...BASIC[kind], ...(site.volt === '고압' ? HIGH : [])]) {
      const sh = await newSheet(site, t), from = prev && prev.sheets.find(x => x.tpl === t);
      if (from) carry(from, sh);
      site.sheets.push(sh);
    }
    await saveSite(site, true);
    location.hash = `#/s/${site.id}`;
  });

}

async function restore(file) {
  if (!file) return;
  let d;
  try { d = JSON.parse(await file.text()); } catch (e) { d = null; }
  if (!d || d.app !== 'suggeom' || !Array.isArray(d.sites)) return alert('수검자 서식 백업 파일이 아니에요.');
  if (!confirm(`백업 파일의 현장 ${d.sites.length}곳을 불러올까요? 같은 현장은 백업 내용으로 덮어씁니다.`)) return;
  for (const s of d.sites) await put('sites', s);
  if (d.tags) await put('meta', { id: 'tags', v: { ...(await getTags()), ...d.tags } });
  alert(`불러오기 완료: 현장 ${d.sites.length}곳`);
  modal.innerHTML = '';
  viewHome();
}

// 파일 보내기: 패드·폰은 공유창(카톡 등), 컴퓨터는 저장. 공유는 버튼을 누른 그 순간에만 열 수 있다.
function saveFile(file) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
function deliver(file) {
  if (CAN_SHARE && navigator.canShare({ files: [file] })) {
    // 안드로이드 카톡은 파일과 제목을 같이 보내면 글자만 받으므로 파일만
    navigator.share({ files: [file] }).catch(e => {
      if (e.name === 'AbortError') return;
      alert(`바로 보내기가 안 돼서 대신 기기에 저장할게요. (${e.name})\n카톡에서 + → 파일 → 다운로드 폴더의 파일을 보내 주세요.`);
      saveFile(file);
    });
  } else saveFile(file);
}

// ---------- PDF: 빈 공식 서식(template.pdf) 위에 적은 내용을 그림으로 겹친다 ----------
let tplDoc = null;
async function makePdfFile(site, stale) {
  if (!window.PDFLib) throw new Error('PDF 도구를 아직 못 불러왔어요. 인터넷에 연결된 상태로 앱을 한 번 다시 열어 주세요.');
  const { PDFDocument } = PDFLib;
  if (!tplDoc) tplDoc = await PDFDocument.load(await (await fetch('template.pdf')).arrayBuffer());
  const doc = await PDFDocument.create();
  doc.setTitle(`${site.name} 수검자 준비자료`);
  const S = 3, cv = document.createElement('canvas'), ctx = cv.getContext('2d');
  try {
    for (const sh of sortSheets(site)) {
      if (stale()) return null;
      const m = TPL[sh.tpl];
      const [pg] = await doc.copyPages(tplDoc, [m.page]);
      doc.addPage(pg);
      if (!filled(sh) && !(site.sign && sigSpots(m).length)) continue;
      cv.width = Math.round(m.w * S); cv.height = Math.round(m.h * S);
      drawSheet(ctx, sh, S, site.sign);
      const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
      pg.drawImage(await doc.embedPng(await blob.arrayBuffer()), { x: 0, y: 0, width: m.w, height: m.h });
    }
  } finally {
    cv.width = cv.height = 0;
  }
  const bytes = await doc.save();
  // 띄어쓰기도 _ (일부 안드로이드 앱이 파일명 공백을 못 받음)
  const name = `${site.name}_수검자서식_${today()}.pdf`.replace(/[\\/:*?"<>|\s]+/g, '_');
  return new File([bytes], name, { type: 'application/pdf' });
}

// ---------- 현장 문서: 서식 전체가 위아래로 이어진 한 문서 ----------
// 빈칸을 누르면 위쪽 막대에서 글자 입력, 네모 칸은 누르면 체크. 서명 한 번, 보내기 한 번.
function viewDoc(site, focusSheet) {
  sortSheets(site);
  const token = viewToken;
  let ver = 0, pdfTimer = 0, building = null, active = null, editOld = null;
  const pdf = { file: null, ver: -1, err: null };
  document.body.classList.add('ed');
  app.innerHTML = `
    <div class="tb" id="tb">
      <div class="tools row">
        <button class="tool" id="bk" aria-label="현장 목록">${I.back}</button>
        <div class="ttl grow">${esc(site.name)}<small>${site.kind}검사 · 서식 ${site.sheets.length}장</small></div>
        <button class="tool ${site.sign ? 'done' : ''}" id="sg">${I.sign}${site.sign ? '서명함' : '서명'}</button>
        <button class="tool pri" id="send">${I.send}${SEND_HTML}</button>
      </div>
    </div>
    <div class="panel" id="panel"><div class="inner">
      <div class="row phead">
        <div class="lab grow" id="elab"></div>
        <div class="seg2" id="emode"><button data-mode="pen">✍ 손글씨</button><button data-mode="kb">⌨ 글자</button></div>
      </div>
      <div id="ewrap"></div>
      <div class="row pfoot">
        <button class="tool" id="eclr">다시 쓰기</button>
        <button class="tool" id="ekb" aria-label="키보드 바꾸기">123</button>
        <span class="grow"></span>
        <button class="tool" id="edn">${I.down}아래</button>
        <button class="tool" id="enx">옆${I.next}</button>
        <button class="tool pri" id="eok">완료</button>
      </div>
    </div></div>
    <div class="doc" id="doc">
      ${IN_APP ? `<div style="max-width:1100px;margin:0 auto">${outsideHelp()}</div>` : ''}
      <p class="tip">빈칸을 누르면 아래에 쓰는 판이 올라와요. 크게 쓰면 서식 칸에 맞게 줄여서 들어가요. 네모(□)는 누르면 체크돼요.</p>
      ${site.sheets.map((sh, i) => {
        const m = TPL[sh.tpl];
        return `<section data-sh="${sh.id}">
          <div class="shh"><span class="no">${i + 1}</span><b class="grow">${esc(sheetName(site, sh))}</b>
            ${m.goods.length ? '<button class="okbtn" data-ok>✓ 모두 양호</button>' : ''}
            <button class="icon-btn" data-more aria-label="이 장 더보기">${I.more}</button></div>
          <div class="pscroll"><div class="page" style="aspect-ratio:${m.w}/${m.h}">
            <img src="bg/${m.tpl}.png" alt="" loading="${i < 2 ? 'eager' : 'lazy'}" decoding="async">
            <canvas></canvas>
            <div class="hits">${m.fields.map(f => {
              const r = f.t === 'check' ? f.hit : f.r;
              return `<div class="hit" data-f="${f.id}" style="left:${r[0] / m.w * 100}%;top:${r[1] / m.h * 100}%;width:${(r[2] - r[0]) / m.w * 100}%;height:${(r[3] - r[1]) / m.h * 100}%"></div>`;
            }).join('')}</div>
            <div class="act"></div>
          </div></div>
        </section>`;
      }).join('')}
      <div class="docend stack">
        <button class="btn lg full" id="send2">${I.send}${SEND_HTML}</button>
        <button class="btn ter full" id="more">더보기 (서식 추가 · 이름 바꾸기 · 현장 삭제)</button>
      </div>
    </div>`;
  const tb = $('#tb'), panel = $('#panel');
  const setTbh = () => document.documentElement.style.setProperty('--tbh', tb.offsetHeight + 'px');
  const setPnh = () => document.documentElement.style.setProperty('--pnh', panel.offsetHeight + 'px');
  // 키보드가 올라오면 쓰는 판도 키보드 바로 위로 올린다
  const placePanel = () => {
    const vv = window.visualViewport;
    const off = vv ? Math.round(innerHeight - vv.height - vv.offsetTop) : 0;
    panel.style.transform = off > 40 ? `translateY(${-off}px)` : '';
  };
  setTbh();

  // 장마다 캔버스. 화면 가까이 있는 장만 그리고 먼 장은 비워서 패드 메모리를 아낀다.
  const pages = new Map();
  app.querySelectorAll('section[data-sh]').forEach(sec => {
    const sh = site.sheets.find(x => x.id === sec.dataset.sh), cv = sec.querySelector('canvas');
    pages.set(sh.id, { sec, sh, m: TPL[sh.tpl], page: sec.querySelector('.page'), cv, ctx: cv.getContext('2d'), on: false });
  });
  const paint = p => {
    if (!p.on) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1), w = p.page.clientWidth;
    p.cv.width = Math.round(w * dpr); p.cv.height = Math.round(w * p.m.h / p.m.w * dpr);
    drawSheet(p.ctx, p.sh, p.cv.width / p.m.w, site.sign);
  };
  const io = new IntersectionObserver(entries => {
    for (const e of entries) {
      const p = pages.get(e.target.dataset.sh);
      p.on = e.isIntersecting;
      if (p.on) paint(p); else p.cv.width = p.cv.height = 0;
    }
  }, { rootMargin: '100% 0px' });
  pages.forEach(p => io.observe(p.sec));
  let lastW = 0;
  const ro = new ResizeObserver(() => {
    const w = app.clientWidth;
    if (w === lastW) return;
    lastW = w; setTbh(); pages.forEach(paint);
  });
  ro.observe(app);
  // 글자 모드에서 키보드가 올라오면 판을 키보드 위로 올리고, 고른 칸이 가리지 않게 다시 맞춘다
  const onVV = () => { if (!active) return; placePanel(); reveal(active.p, active.f); };
  if (window.visualViewport) ['resize', 'scroll'].forEach(t => visualViewport.addEventListener(t, onVV));
  viewCleanup = () => {
    io.disconnect(); ro.disconnect(); clearTimeout(pdfTimer);
    if (window.visualViewport) ['resize', 'scroll'].forEach(t => visualViewport.removeEventListener(t, onVV));
    document.body.classList.remove('editing');
  };
  const rerender = () => { viewToken++; viewCleanup(); viewDoc(site); };

  // 바뀔 때마다 저장하고, 잠시 뒤 PDF를 미리 만들어 둔다 (보내기를 누르면 바로 공유창이 뜨게)
  const stale = v => () => ver !== v || token !== viewToken;
  function buildPdf() {
    if (building) return building.then(() => (pdf.ver !== ver && token === viewToken ? buildPdf() : null));
    const v = ver;
    building = makePdfFile(site, stale(v))
      .then(f => { if (f && v === ver) { pdf.file = f; pdf.ver = v; pdf.err = null; } })
      .catch(e => { pdf.err = e; })
      .finally(() => { building = null; });
    return building;
  }
  const schedulePdf = (ms = 2500) => { clearTimeout(pdfTimer); pdfTimer = setTimeout(() => { if (token === viewToken) buildPdf(); }, ms); };
  function changed(p) { ver++; paint(p); saveSite(site); schedulePdf(); }
  schedulePdf(1500);

  const tags = getTags();
  function setVal(p, f, val) {
    if (val) p.sh.v[f.id] = val; else delete p.sh.v[f.id];
    if (f.tag && f.t !== 'check' && !f.tag.startsWith('date.') && !f.tag.startsWith('site.')) {
      tags.then(t => { t[f.tag] = val; put('meta', { id: 'tags', v: t }); });
    }
  }
  function toggle(p, f) {
    const on = !p.sh.v[f.id];
    if (on && f.ex) for (const g of p.m.fields) if (g.grp === f.grp && g !== f) delete p.sh.v[g.id];
    setVal(p, f, on);
    changed(p);
  }

  // 칸 누르기 (손가락·펜 모두). 손글씨를 쓰는 동안·직후에 손바닥이 서식에 닿아 생긴 누름은 무시한다.
  let palm = false;
  $('#doc').addEventListener('pointerdown', e => {
    palm = e.pointerType === 'touch' && penSeen && (e.width > 45 || e.height > 45);
  }, true);
  $('#doc').addEventListener('click', e => {
    if (palm || Date.now() - inkAt < 600) return;
    const hit = e.target.closest('.hit');
    if (hit) {
      const p = pages.get(hit.closest('section').dataset.sh), f = p.m.byId[hit.dataset.f];
      if (f.t === 'check') { closeEdit(); toggle(p, f); } else openEdit(p, f);
      return;
    }
    const sec = e.target.closest('section');
    if (sec && e.target.closest('[data-ok]')) allGood(pages.get(sec.dataset.sh));
    if (sec && e.target.closest('[data-more]')) sheetMenu(pages.get(sec.dataset.sh));
  });

  // 쓰는 판 (화면 아래에서 올라온다). 칸을 직접 누르면 손글씨로 시작하고,
  // [아래]/[옆]으로 넘어갈 때만 지금 쓰던 방식(글자로 바꿨으면 글자)을 이어 간다.
  function openEdit(p, f, keepMode) {
    commitEdit();
    if (!keepMode) inputMode = 'pen';
    active = { p, f }; editOld = p.sh.v[f.id];
    $('#elab').textContent = `${sheetName(site, p.sh)} · ${f.label || '입력'}${f.unit ? ` ${f.unit}` : ''}`;
    document.body.classList.add('editing');
    pages.forEach(q => { q.page.querySelector('.act').style.display = 'none'; });
    const a = p.page.querySelector('.act'), r = f.r;
    Object.assign(a.style, { display: 'block', left: r[0] / p.m.w * 100 + '%', top: r[1] / p.m.h * 100 + '%', width: (r[2] - r[0]) / p.m.w * 100 + '%', height: (r[3] - r[1]) / p.m.h * 100 + '%' });
    mountEditor();
  }
  function mountEditor() {
    const { p, f } = active, pen = inputMode === 'pen';
    $('#emode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.mode === inputMode));
    $('#eclr').hidden = !pen;
    $('#ekb').hidden = pen || f.t === 'area';
    if (pen) {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      mountPad(p, f);
    } else mountInput(p, f);
    setPnh(); placePanel();
    setTimeout(() => reveal(p, f), 60);
  }
  $('#emode').onclick = e => {
    const b = e.target.closest('[data-mode]');
    if (!b || !active) return;
    inputMode = b.dataset.mode;
    mountEditor();
  };
  function mountInput(p, f) {
    const multi = f.t === 'area', v = p.sh.v[f.id];
    $('#ewrap').innerHTML = multi ? '<textarea id="ein"></textarea>' : '<input id="ein" type="text" autocomplete="off" enterkeyhint="next">';
    const ein = $('#ein');
    ein.value = typeof v === 'string' ? v : '';
    ein.placeholder = isInk(v) ? '손글씨가 들어 있어요. 글자를 쓰면 바뀌어요' : f.ph ? `예: ${f.ph}` : '';
    const numeric = !multi && (f.date || f.unit || NUMERIC.test(f.label || ''));
    ein.inputMode = numeric ? 'decimal' : 'text';
    $('#ekb').textContent = numeric ? '가' : '123';
    ein.oninput = () => {
      if (ein.value) p.sh.v[f.id] = ein.value; else if (!isInk(editOld)) delete p.sh.v[f.id]; else p.sh.v[f.id] = editOld;
      ver++; paint(p); saveSite(site);
    };
    ein.onkeydown = e => { if (e.key === 'Enter' && !multi) { e.preventDefault(); move(1); } };
    ein.focus({ preventScroll: true });
  }
  // 손글씨 칸: 크게 쓴 글씨를 저장했다가, 서식에는 칸 크기에 맞춰 줄여서 그린다 (drawInk).
  // 좌표는 패드 높이를 100으로 본 단위로 저장해서 화면 크기가 바뀌어도 그대로 쓴다.
  function mountPad(p, f) {
    $('#ewrap').innerHTML = `<canvas class="hpad ${f.t === 'area' ? 'area' : ''}" id="hpad"></canvas>`;
    const cv = $('#hpad'), c = cv.getContext('2d'), dpr = Math.min(3, window.devicePixelRatio || 1);
    const W = cv.clientWidth, H = cv.clientHeight, k = H / 100;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    c.scale(dpr, dpr);
    const v = p.sh.v[f.id];
    let ink = isInk(v) ? v.ink.map(s => s.slice()) : [], cur = null;
    const pen = () => { c.strokeStyle = INK; c.lineWidth = 3.2; c.lineCap = 'round'; c.lineJoin = 'round'; };
    const redrawPad = () => {
      c.clearRect(0, 0, W, H);
      c.strokeStyle = '#dfe3dc'; c.lineWidth = 1; c.setLineDash([6, 6]);
      c.beginPath(); c.moveTo(12, H * 0.78); c.lineTo(W - 12, H * 0.78); c.stroke();
      c.setLineDash([]);
      if (!ink.length) {
        c.fillStyle = '#a9ada6'; c.font = `600 19px ${FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
        c.fillText(f.ph ? `여기에 크게 쓰세요 (예: ${f.ph})` : '여기에 크게 쓰세요', W / 2, H * 0.42);
      }
      pen();
      for (const s of ink) {
        c.beginPath(); c.moveTo(s[0] * k, s[1] * k);
        if (s.length === 2) c.lineTo(s[0] * k + 0.01, s[1] * k);
        for (let i = 2; i < s.length; i += 2) c.lineTo(s[i] * k, s[i + 1] * k);
        c.stroke();
      }
    };
    redrawPad();
    const pt = e => { const r = cv.getBoundingClientRect(); return [Math.round((e.clientX - r.left) / k * 10) / 10, Math.round((e.clientY - r.top) / k * 10) / 10]; };
    cv.onpointerdown = e => {
      if (e.pointerType === 'pen') penSeen = true;
      else if (penSeen && e.pointerType === 'touch') return;   // 펜으로 쓰는 중에 닿은 손바닥은 무시
      if (cur) return;
      e.preventDefault();
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* 캡처가 안 돼도 그리기는 된다 */ }
      cur = { id: e.pointerId, s: pt(e) };
      ink.push(cur.s);
      inkAt = Date.now();
      redrawPad();
    };
    cv.onpointermove = e => {
      if (!cur || e.pointerId !== cur.id) return;
      const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
      for (const ev of evs.length ? evs : [e]) {
        const [x, y] = pt(ev), s = cur.s, lx = s[s.length - 2], ly = s[s.length - 1];
        if (Math.hypot(x - lx, y - ly) < 0.6) continue;
        s.push(x, y);
        c.beginPath(); c.moveTo(lx * k, ly * k); c.lineTo(x * k, y * k); c.stroke();
      }
      inkAt = Date.now();
    };
    cv.onpointerup = cv.onpointercancel = e => {
      if (!cur || e.pointerId !== cur.id) return;
      cur = null; inkAt = Date.now();
      p.sh.v[f.id] = { ink: ink.map(s => s.slice()), box: inkBox(ink) };
      ver++; paint(p); saveSite(site);
    };
    $('#eclr').onclick = () => {
      ink = [];
      delete p.sh.v[f.id];
      redrawPad(); ver++; paint(p); saveSite(site);
    };
  }
  // 입력을 마칠 때: 바뀐 값을 자동 채움 값(작성자·서명줄 이름)에 남기고 PDF 준비
  function commitEdit() {
    if (!active) return;
    const { p, f } = active, now = p.sh.v[f.id];
    active = null;
    if ((now || '') !== (editOld || '')) { setVal(p, f, now || ''); changed(p); }
  }
  function closeEdit() {
    commitEdit();
    document.body.classList.remove('editing');
    panel.style.transform = '';
    pages.forEach(q => { q.page.querySelector('.act').style.display = 'none'; });
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }
  // 고른 칸이 위 막대와 아래 판 사이에 보이게 화면을 옮긴다 (폰에서는 좌우로도)
  function reveal(p, f) {
    const sc = p.page.parentElement, k = p.page.getBoundingClientRect().width / p.m.w;
    if (sc.scrollWidth > sc.clientWidth + 1) {
      const l = f.r[0] * k, r = f.r[2] * k, view = sc.clientWidth;
      if (l < sc.scrollLeft + 8 || r > sc.scrollLeft + view - 8) {
        sc.scrollLeft = Math.max(0, r - l > view - 32 ? l - 16 : (l + r) / 2 - view / 2);
      }
    }
    const pr = p.page.getBoundingClientRect();
    const top = pr.top + f.r[1] * k, bot = pr.top + f.r[3] * k;
    const minY = tb.offsetHeight + 12;
    const maxY = (document.body.classList.contains('editing') ? panel.getBoundingClientRect().top : innerHeight) - 12;
    if (top < minY) scrollBy(0, top - minY);
    else if (bot > maxY) scrollBy(0, bot - maxY + Math.min(60, Math.max(0, (maxY - minY) / 4)));
  }
  function move(step) {
    const { p, f } = active, n = p.m.inputs[p.m.inputs.indexOf(f) + step];
    if (n) openEdit(p, n, true); else closeEdit();
  }
  $('#enx').onclick = () => move(1);
  $('#edn').onclick = () => {   // 바로 아래 칸 (같은 열)
    const { p, f } = active, cx = (f.r[0] + f.r[2]) / 2;
    const below = p.m.inputs.filter(g => g.r[1] >= f.r[3] - 1 && g.r[0] - 1 <= cx && cx <= g.r[2] + 1).sort((a, b) => a.r[1] - b.r[1]);
    if (below[0]) openEdit(p, below[0], true); else move(1);
  };
  $('#eok').onclick = closeEdit;
  $('#ekb').onclick = () => {
    const ein = $('#ein'), num = ein.inputMode === 'decimal';
    ein.inputMode = num ? 'text' : 'decimal';
    $('#ekb').textContent = num ? '123' : '가';
    ein.blur(); ein.focus();
  };

  // 양호/불량 묶음 중 아무것도 안 고른 줄만 양호(없음)로. 이미 고른 줄은 그대로.
  function allGood(p) {
    let n = 0;
    for (const g of p.m.goods) {
      if (g.some(f => p.sh.v[f.id])) continue;
      p.sh.v[g[0].id] = true; n++;
    }
    if (n) changed(p); else alert('빈 줄이 없어요. 고칠 줄은 네모를 직접 눌러 주세요.');
  }

  // 장 하나 더 / 빼기
  function sheetMenu(p) {
    const name = sheetName(site, p.sh);
    sheetModal(`<h2>${esc(name)}</h2>
      <p class="note">인버터는 대수만큼, 모듈 기록표는 접속함 수만큼 장을 늘려 주세요.</p>
      <div class="stack" style="margin-top:14px">
        <button class="btn ter full" id="dup">같은 서식 한 장 더 (적은 내용 복사)</button>
        <button class="btn ter full" id="blank">같은 서식 빈 장 추가</button>
        <button class="btn danger full" id="rm">이 장 빼기</button>
      </div>`);
    const add = async from => {
      const sh = await newSheet(site, p.sh.tpl, from);
      site.sheets.push(sh);
      await saveSite(site, true);
      modal.innerHTML = '';
      location.replace(`#/s/${site.id}/${sh.id}`);
    };
    $('#dup').onclick = () => add(p.sh);
    $('#blank').onclick = () => add(null);
    $('#rm').onclick = async () => {
      if (!confirm(`"${name}"을 뺄까요? 이 장에 적은 내용도 함께 지워져요.`)) return;
      site.sheets = site.sheets.filter(x => x !== p.sh);
      await saveSite(site, true);
      modal.innerHTML = '';
      rerender();
    };
  }

  // 서명: 한 번 하면 모든 장의 서명칸에 들어간다
  $('#sg').onclick = async () => {
    closeEdit();
    const last = await get('meta', 'sign');
    sheetModal(`<h2>서명</h2>
      <p class="note">아래 네모 안에 손가락이나 펜으로 서명하세요. 모든 장의 서명칸에 들어가요.</p>
      <canvas class="pad" id="pad"></canvas>
      <div class="row" style="margin-top:12px; flex-wrap:wrap">
        <button class="btn ter" id="clr">다시 쓰기</button>
        ${last ? '<button class="btn ter" id="prev">지난번 서명 쓰기</button>' : ''}
        <button class="btn grow" id="ok">이 서명으로 넣기</button>
      </div>
      ${site.sign ? '<button class="btn link" id="nosign">서명 빼기</button>' : ''}`);
    const pad = $('#pad'), pctx = pad.getContext('2d'), dpr = window.devicePixelRatio || 1;
    pad.width = pad.clientWidth * dpr; pad.height = pad.clientHeight * dpr;
    pctx.scale(dpr, dpr); pctx.lineWidth = 3; pctx.lineCap = 'round'; pctx.lineJoin = 'round'; pctx.strokeStyle = INK;
    const strokes = [];
    let cur = null;
    const pt = e => { const r = pad.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    pad.onpointerdown = e => {
      e.preventDefault();
      try { pad.setPointerCapture(e.pointerId); } catch (err) { /* 캡처가 안 돼도 그리기는 된다 */ }
      const [x, y] = pt(e);
      cur = [x, y]; strokes.push(cur);
      pctx.beginPath(); pctx.moveTo(x, y); pctx.lineTo(x + 0.01, y); pctx.stroke();
    };
    pad.onpointermove = e => {
      if (!cur) return;
      const [x, y] = pt(e), lx = cur[cur.length - 2], ly = cur[cur.length - 1];
      if (Math.hypot(x - lx, y - ly) < 1) return;
      cur.push(x, y);
      pctx.beginPath(); pctx.moveTo(lx, ly); pctx.lineTo(x, y); pctx.stroke();
    };
    pad.onpointerup = pad.onpointercancel = () => { cur = null; };
    $('#clr').onclick = () => { strokes.length = 0; pctx.clearRect(0, 0, pad.width, pad.height); };
    const use = async sign => {
      site.sign = sign;
      await saveSite(site, true);
      if (sign) await put('meta', { id: 'sign', v: sign });
      modal.innerHTML = '';
      const b = $('#sg');
      b.classList.toggle('done', !!sign);
      b.innerHTML = `${I.sign}${sign ? '서명함' : '서명'}`;
      ver++; pages.forEach(paint); schedulePdf(500);
    };
    $('#ok').onclick = () => {
      if (!strokes.length) return alert('네모 안에 서명을 해 주세요.');
      const all = strokes.flat(), xs = all.filter((_, i) => i % 2 === 0), ys = all.filter((_, i) => i % 2 === 1);
      use({ s: strokes.map(s => s.map(v => Math.round(v * 10) / 10)), box: [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)] });
    };
    if (last) $('#prev').onclick = () => use(last.v);
    if (site.sign) $('#nosign').onclick = () => use(null);
  };

  // 보내기: 미리 만들어 둔 PDF가 있으면 바로 공유창, 없으면 만들고 한 번 더 누르게
  const send = () => {
    closeEdit();
    if (pdf.file && pdf.ver === ver) { deliver(pdf.file); return; }
    clearTimeout(pdfTimer);
    const b = busy('PDF 만드는 중…');
    buildPdf().then(() => {
      b.remove();
      if (token !== viewToken) return;
      if (pdf.file && pdf.ver === ver) {
        sheetModal(`<h2>PDF가 준비됐어요</h2><p class="note">서식 ${site.sheets.length}장${site.sign ? '' : ' · 아직 서명 안 함'}</p>
          <button class="btn lg full" id="go" style="margin-top:16px">${I.send}${SEND_LABEL}</button>`);
        $('#go').onclick = () => { modal.innerHTML = ''; deliver(pdf.file); };
      } else alert(`PDF를 만들지 못했어요.\n${pdf.err ? pdf.err.message || pdf.err : '다시 한 번 눌러 주세요.'}`);
    });
  };
  $('#send').onclick = send;
  $('#send2').onclick = send;

  $('#bk').onclick = () => { closeEdit(); location.hash = '#/'; };
  $('#more').onclick = () => {
    sheetModal(`<h2>더보기</h2>
      <div class="stack" style="margin-top:12px">
        <button class="btn ter full" id="addsh">서식 추가</button>
        <button class="btn ter full" id="ren">현장 이름 바꾸기</button>
        <button class="btn danger full" id="rmsite">현장 삭제</button>
      </div>`);
    $('#addsh').onclick = () => {
      sheetModal(`<h2>서식 추가</h2><p class="note">공식 서식 16종 중에서 고르세요.</p>
        <div class="pick">${META.map(m => `<button data-t="${m.tpl}">${esc(m.short)}<small>${esc(m.title)}</small></button>`).join('')}</div>`);
      modal.querySelectorAll('[data-t]').forEach(b => b.onclick = async () => {
        const sh = await newSheet(site, b.dataset.t);
        site.sheets.push(sh);
        await saveSite(site, true);
        modal.innerHTML = '';
        location.replace(`#/s/${site.id}/${sh.id}`);
      });
    };
    $('#ren').onclick = async () => {
      const n = prompt('현장 이름', site.name);
      if (!n || !n.trim()) return;
      site.name = n.trim();
      await saveSite(site, true);
      modal.innerHTML = '';
      rerender();
    };
    $('#rmsite').onclick = async () => {
      if (!confirm(`"${site.name}" 현장을 지울까요? 서식 ${site.sheets.length}장이 모두 지워져요.${SYNC_URL
        ? '\n다른 기기에서도 사라지고, 구글 드라이브의 \'삭제됨\' 폴더에 보관돼요.' : '\n되돌릴 수 없어요.'}`)) return;
      await del('sites', site.id);
      if (SYNC_URL) {
        const q = ((await get('meta', 'deletedQ')) || { ids: [] }).ids;
        await put('meta', { id: 'deletedQ', ids: [...q, site.id] });
      }
      curSite = null; location.hash = '#/';
      syncDrive();   // 다른 기기에서도 바로 지워지게
    };
  };

  if (focusSheet && pages.has(focusSheet)) scrollTo(0, pages.get(focusSheet).sec.getBoundingClientRect().top + scrollY - tb.offsetHeight - 8);
  else scrollTo(0, 0);
}

// ---------- 시작 ----------
(async () => {
  await loadMeta();
  await route();
  syncDrive();
})();
</script>
</body>
</html>
